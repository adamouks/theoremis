[package]
name = "theoremis"
version = "0.1.0"
description = "Theoremis — the AI-native workspace for mathematics"
authors = ["adamouks"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "theoremis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "fs", "net", "io-util", "time", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
thiserror = "2"
keyring = "4"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
tauri-plugin-dialog = "2"

# Printing with the page's margins (src/print.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
tempfile = "3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
