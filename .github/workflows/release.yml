name: Release

# Builds installers for macOS, Windows and Linux, attaches them to a GitHub release and
# publishes it once every platform has built. Run it by pushing a tag like `v0.1.0`, or from
# the Actions tab; either way it releases the version in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Theoremis v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Download the installer for your computer below, or from https://theoremis.vercel.app.

            | | |
            | --- | --- |
            | **macOS** (Apple silicon) | `Theoremis_*_aarch64.dmg` |
            | **macOS** (Intel) | `Theoremis_*_x64.dmg` |
            | **Windows** | `Theoremis_*_x64-setup.exe` |
            | **Linux** | `.AppImage`, `.deb` or `.rpm` |

            These builds aren't notarized by Apple or signed for Windows yet, so the first launch needs one extra step:

            - **macOS:** open the app once, then go to System Settings → Privacy & Security and choose **Open Anyway**. Or run `xattr -dr com.apple.quarantine /Applications/Theoremis.app`.
            - **Windows:** if SmartScreen appears, choose **More info → Run anyway**.
            - **Linux:** make the AppImage executable with `chmod +x Theoremis_*.AppImage`.

            Then sign in with ChatGPT in Settings to use your plan, or point Theoremis at a local Ollama server.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The release stays a draft until every installer is attached, so the download links on the
  # site never point at a half-finished release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release edit "v$version" --draft=false --latest
