name: Release

# Builds installers for macOS, Windows and Linux, attaches them to a GitHub release and
# publishes it once every platform has built. Run it by pushing a tag like `v0.1.0`, or from
# the Actions tab; either way it releases the version in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One draft for every build to attach to, so parallel builds can't each create their own.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { version } = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const tag = `v${version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing && !existing.draft) {
              core.setFailed(`${tag} is already published. Bump the version in src-tauri/tauri.conf.json first.`);
              return;
            }
            if (existing) return existing.id;
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Theoremis ${tag}`,
              body: fs.readFileSync(".github/release-notes.md", "utf8"),
              draft: true,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # With a Developer ID certificate in the repository secrets, the app is signed and
      # notarized so macOS opens it without a warning. Without one it's ad-hoc signed
      # (bundle.macOS.signingIdentity "-") and Gatekeeper asks on first launch.
      - name: Use the Developer ID certificate, if configured
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::warning::No Developer ID certificate in the secrets: this macOS build is ad-hoc signed, so Gatekeeper will ask before it opens."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$(printf %s "$APPLE_CERTIFICATE" | tr -d '\r\n ')"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            # The bundler signs with the certificate's own identity; this only has to match it.
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID aren't all set: the app is signed but not notarized, so Gatekeeper will still warn."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # Published only once every installer is attached, so the site's download links never point
  # at a half-finished release.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number("${{ needs.create-release.outputs.release_id }}"),
              draft: false,
              make_latest: "true",
            });
