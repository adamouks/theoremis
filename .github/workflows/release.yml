name: Release

# Every push that passes CI and changes the app (anything under app/) becomes a release:
# installers for macOS, Windows and Linux, plus the signed update bundles and latest.json that
# installed copies of Theoremis check for. The version is the major.minor from
# app/src-tauri/tauri.conf.json and this workflow's run number as the patch, so each release is
# newer than the last. It can also be run by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides whether this commit ships, and if so makes the one draft every build attaches to.
  create-release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      version: ${{ steps.draft.outputs.version }}
      sha: ${{ steps.draft.outputs.sha }}
      notes: ${{ steps.draft.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: draft
        uses: actions/github-script@v7
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          script: |
            const fs = require("fs");
            const sha = process.env.SHA;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);

            // The same commit can arrive from more than one branch; release it once. A run started
            // by hand always releases, e.g. to republish once the update-signing key is set.
            if (process.env.MANUAL !== "true" && releases.some((r) => !r.draft && r.target_commitish === sha)) {
              core.notice(`${sha.slice(0, 7)} is already released.`);
              return;
            }

            // Only changes to the app itself are worth an update; the site and docs ship elsewhere.
            const app = /^app\//;
            const previous = releases.find((r) => !r.draft && !r.prerelease);
            let changes = [];
            if (previous) {
              try {
                const { data } = await github.rest.repos.compareCommits({ ...context.repo, base: previous.target_commitish, head: sha });
                const files = data.files ?? [];
                if (process.env.MANUAL !== "true" && files.length < 300 && !files.some((f) => app.test(f.filename))) {
                  core.notice(`No app changes since ${previous.tag_name}.`);
                  return;
                }
                changes = data.commits.map((c) => c.commit.message.split("\n")[0]).reverse().slice(0, 20);
              } catch (error) {
                core.warning(`Couldn't compare with ${previous.tag_name}: ${error.message}`);
              }
            }

            const { version: configured } = JSON.parse(fs.readFileSync("app/src-tauri/tauri.conf.json", "utf8"));
            const [major, minor] = configured.split(".");
            const version = `${major}.${minor}.${context.runNumber}`;
            const tag = `v${version}`;
            let release = releases.find((r) => r.tag_name === tag);
            if (release && !release.draft) {
              core.setFailed(`${tag} is already published.`);
              return;
            }
            if (!release) {
              const whatsNew = changes.length ? `## What's new\n\n${changes.map((c) => `- ${c}`).join("\n")}\n\n` : "";
              ({ data: release } = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: sha,
                name: `Theoremis ${tag}`,
                body: whatsNew + fs.readFileSync(".github/release-notes.md", "utf8"),
                draft: true,
              }));
            }
            core.setOutput("release_id", String(release.id));
            core.setOutput("version", version);
            core.setOutput("sha", sha);
            core.setOutput("notes", changes.map((c) => `- ${c}`).join("\n"));

  build:
    needs: create-release
    if: needs.create-release.outputs.release_id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.sha }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
        working-directory: app
      - name: Set the version and the update bundles
        shell: bash
        working-directory: app
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.VERSION;
            // Update bundles are signed with the private key; without it the release still builds.
            if (process.env.UPDATER_KEY) config.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          '
          if [ -z "$UPDATER_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't in the repository secrets, so installed apps won't update to this release."
          fi
      # With a Developer ID certificate in the repository secrets, the app is signed and
      # notarized so macOS opens it without a warning. Without one it's ad-hoc signed
      # (bundle.macOS.signingIdentity "-") and Gatekeeper asks on first launch.
      - name: Use the Developer ID certificate, if configured
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::warning::No Developer ID certificate in the secrets: this macOS build is ad-hoc signed, so Gatekeeper will ask before it opens."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$(printf %s "$APPLE_CERTIFICATE" | tr -d '\r\n ')"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            # The bundler signs with the certificate's own identity; this only has to match it.
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID aren't all set: the app is signed but not notarized, so Gatekeeper will still warn."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json is written once, below, from every platform's signature.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Writes latest.json and publishes the release once every installer is attached, so neither
  # the site's download links nor installed apps ever see a half-finished release.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
          NOTES: ${{ needs.create-release.outputs.notes }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const version = process.env.VERSION;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id });

            // Each update platform installs one bundle, signed in a .sig file beside it.
            const bundles = {
              "darwin-aarch64": /_aarch64\.app\.tar\.gz$/,
              "darwin-x86_64": /_x64\.app\.tar\.gz$/,
              "linux-x86_64": /\.AppImage$/,
              "windows-x86_64": /-setup\.exe$/,
            };
            const platforms = {};
            for (const [platform, pattern] of Object.entries(bundles)) {
              const bundle = assets.find((a) => pattern.test(a.name));
              const signature = bundle && assets.find((a) => a.name === `${bundle.name}.sig`);
              if (!signature) continue;
              const { data } = await github.rest.repos.getReleaseAsset({
                ...context.repo,
                asset_id: signature.id,
                headers: { accept: "application/octet-stream" },
              });
              platforms[platform] = {
                signature: Buffer.from(data).toString("utf8").trim(),
                // Drafts have provisional download URLs; these are the ones the tag will have.
                url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/v${version}/${encodeURIComponent(bundle.name)}`,
              };
            }

            if (Object.keys(platforms).length === 0) {
              core.warning("No signed update bundles, so installed apps won't update to this release. Add TAURI_SIGNING_PRIVATE_KEY to the repository secrets.");
            } else {
              for (const old of assets.filter((a) => a.name === "latest.json")) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: old.id });
              }
              const notes = process.env.NOTES || `Theoremis ${version}`;
              const manifest = { version, notes, pub_date: new Date().toISOString(), platforms };
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id,
                name: "latest.json",
                data: JSON.stringify(manifest, null, 2),
                headers: { "content-type": "application/json" },
              });
            }

            await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false, make_latest: "true" });
